<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060d14">
  <meta name="description" content="VSGAMEの職業・敵・ボス図鑑、マップ、戦闘システム、天賦、アイテム、開発フェーズ、相関図を一元管理する開発記録庫">
  <title>VSGAME 開発記録庫</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23060d14'/%3E%3Cpath d='M32 6 54 18v28L32 58 10 46V18Z' fill='none' stroke='%23d7b16a' stroke-width='4'/%3E%3Cpath d='m20 22 12 24 12-24M22 34h20' fill='none' stroke='%2363d5ce' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/images/title-gate.png">
  <link rel="stylesheet" href="styles.css?v=20261004-ember-v5">
  <link rel="stylesheet" href="crafted-ui.css?v=20261004-ember-v5">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="メインナビゲーション">
      <a class="brand" href="#overview" data-route="overview" aria-label="VSGAME 開発記録庫のホームへ">
        <span class="brand-mark" aria-hidden="true"><span>V</span></span>
        <span class="brand-copy"><strong>VSGAME</strong><small>開発記録庫</small></span>
      </a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="sidebar-foot">
        <span class="sync-dot" aria-hidden="true"></span>
        <span class="foot-copy">
          <small>最終更新</small>
          <strong id="updatedAt">2026-09-11</strong>
          <span class="foot-version" id="dashVersion"></span>
        </span>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button>
        <div class="page-heading">
          <span class="eyebrow" id="pageEyebrow">ARCHIVE HOME</span>
          <h1 id="pageTitle">ホーム</h1>
        </div>
        <label class="global-search">
          <span aria-hidden="true">⌕</span>
          <input id="globalSearch" type="search" placeholder="職業・敵・ボス・仕様・タスクを検索" autocomplete="off" aria-label="記録庫を検索">
          <kbd>/</kbd>
        </label>
      </header>

      <main id="mainContent" tabindex="-1">
        <section class="loading-state" aria-live="polite">
          <span class="seal-loader" aria-hidden="true"></span>
          <p>記録庫を読み込んでいます</p>
        </section>
      </main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="mobile-drawer" id="mobileDrawer" aria-label="画面一覧" aria-hidden="true">
    <div class="drawer-head"><strong>記録庫の目次</strong><button class="icon-button" id="drawerClose" type="button" aria-label="メニューを閉じる">×</button></div>
    <nav id="drawerNav"></nav>
  </aside>

  <nav class="bottom-nav" id="bottomNav" aria-label="スマートフォン用ナビゲーション"></nav>

  <dialog class="image-dialog" id="imageDialog" aria-labelledby="imageDialogTitle">
    <button class="icon-button image-dialog-close" id="imageDialogClose" type="button" aria-label="画像を閉じる">×</button>
    <div class="image-dialog-stage"><img id="imageDialogImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""></div>
    <div class="image-dialog-copy">
      <h2 id="imageDialogTitle"></h2>
      <p id="imageDialogCaption"></p>
      <div class="image-dialog-meta" id="imageDialogMeta"></div>
    </div>
  </dialog>

  <script src="app.js?v=20261004-ember-v5" defer></script>
</body>
</html>
